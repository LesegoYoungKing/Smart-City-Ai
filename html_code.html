<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Smart City Optimization Platform</title>
</head>
<body>
    <div class="container">
        <h1>Smart City Optimization Platform</h1>

        <!-- Energy Prediction Form -->
        <section>
            <h2>Energy Prediction</h2>
            <form id="energy-form">
                <label for="buildingId">Building ID:</label>
                <input type="number" id="buildingId" name="buildingId" required>

                <label for="hoursAhead">Hours Ahead:</label>
                <input type="number" id="hoursAhead" name="hoursAhead" required>

                <button type="submit">Predict Energy Usage</button>
            </form>
            <div id="energy-result"></div>
        </section>

        <!-- Traffic Congestion Prediction Form -->
        <section>
            <h2>Traffic Congestion Prediction</h2>
            <form id="traffic-form">
                <label for="roadId">Road ID:</label>
                <input type="number" id="roadId" name="roadId" required>

                <label for="trafficHoursAhead">Hours Ahead:</label>
                <input type="number" id="trafficHoursAhead" name="trafficHoursAhead" required>

                <button type="submit">Predict Traffic Congestion</button>
            </form>
            <div id="traffic-result"></div>
        </section>

        <!-- Waste Collection Optimization -->
        <section>
            <h2>Waste Collection Optimization</h2>
            <button id="optimize-waste">Optimize Waste Collection</button>
            <div id="waste-result"></div>
        </section>

        <!-- Quiz Form for AI-Tailored Solutions -->
        <section>
            <h2>Get Your AI-Tailored Solution</h2>
            <form id="quiz-form">
                <label for="userType">User Type:</label>
                <select id="userType" name="userType" required>
                    <option value="resident">Resident</option>
                    <option value="business">Business</option>
                    <option value="government">Government</option>
                </select>

                <label for="concern">Primary Concern:</label>
                <select id="concern" name="concern" required>
                    <option value="energy">Energy</option>
                    <option value="traffic">Traffic</option>
                    <option value="waste">Waste</option>
                </select>

                <label for="location">Location:</label>
                <input type="text" id="location" name="location" required>

                <button type="submit">Get Solution</button>
            </form>
            <div id="quiz-result"></div>
        </section>

        <!-- AI Solutions Section -->
        <section id="ai-solutions-section" style="display: none;">
            <h2>AI-Tailored Solutions</h2>
            <div id="ai-solution"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
